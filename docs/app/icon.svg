<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="claudekit">
    <title>claudekit</title>
    <defs>
        <!--
         * The app tile: white ground, agent mark on the brand ramp. `userSpaceOnUse` so the ramp runs
         * once across the whole mark. Coordinates are in the mark's own 24 space (the group transform
         * applies to them too).
         -->
        <linearGradient id="ck-tile-mark" gradientUnits="userSpaceOnUse" x1="2" y1="4" x2="22" y2="20">
            <stop offset="0" stop-color="#2563EB" />
            <stop offset="55%" stop-color="#6D5DF6" />
            <stop offset="100%" stop-color="#8A54D8" />
        </linearGradient>
    </defs>
    <rect width="128" height="128" rx="30" fill="#fff" />
    <g transform="translate(23 23) scale(3.4167)">
        <g stroke="url(#ck-tile-mark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8" />
            <rect x="4" y="8" width="16" height="12" rx="2" />
            <path d="M2 14h2" />
            <path d="M20 14h2" />
            <path d="M15 13v2" />
            <path d="M9 13v2" />
        </g>
    </g>
</svg>
